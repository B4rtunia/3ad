<!DOCTYPE html>
<html lang="pl">
<head>

<title>English for IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#eef2f3;--sf:#fff;--sf2:#e4ebed;--ink:#14212b;--mut:#5d6b78;--line:#d3dde1;--ac:#0e7490;--acs:#d8f0f6;--ok:#12794a;--oks:#dcf3e6;--bad:#bf3434;--bads:#fbe2e2;--wn:#946200;--wns:#fff0cc;--mk:#ffe58a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171c;--sf:#18222a;--sf2:#212d36;--ink:#e8eef2;--mut:#93a3b0;--line:#2f3d48;--ac:#59c3de;--acs:#17353f;--ok:#5fcf93;--oks:#15362a;--bad:#ff8c8c;--bads:#3d2024;--wn:#f0bb52;--wns:#3a2f14;--mk:#6b5a14}}
:root[data-theme="dark"]{--bg:#10171c;--sf:#18222a;--sf2:#212d36;--ink:#e8eef2;--mut:#93a3b0;--line:#2f3d48;--ac:#59c3de;--acs:#17353f;--ok:#5fcf93;--oks:#15362a;--bad:#ff8c8c;--bads:#3d2024;--wn:#f0bb52;--wns:#3a2f14;--mk:#6b5a14}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Instrument Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--line)}
.top b{font-family:Newsreader,Georgia,serif;font-size:19px}
.top small{display:block;color:var(--mut);font-size:12px;line-height:1.2}
.grow{flex:1}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sf);cursor:pointer;font-size:17px}
.icon:hover{background:var(--sf2)}
.gprog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.bar{width:110px;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.shell{flex:1;min-height:0;display:flex;position:relative}
#side{width:310px;flex:none;background:var(--sf);border-right:1px solid var(--line);overflow:auto;transition:margin .25s;padding:14px 12px 30px}
#app.closed #side{margin-left:-311px}
#main{flex:1;min-width:0;overflow:auto;padding:28px clamp(14px,4vw,48px) 60px}
#stage{max-width:900px;margin:0 auto}
#scrim{display:none}
@media(max-width:860px){#side{position:absolute;inset:0 auto 0 0;z-index:20;box-shadow:4px 0 24px rgba(0,0,0,.2);width:min(310px,86vw)}#app.closed #side{margin-left:-110%}#app:not(.closed) #scrim{display:block;position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.35)}.gprog span{display:none}.bar{width:60px}}
.seg{display:flex;background:var(--sf2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
details{margin-bottom:6px}
summary{cursor:pointer;padding:8px 6px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"▾";color:var(--mut);transition:transform .2s}
details:not([open]) summary:after{transform:rotate(-90deg)}
summary small{font-weight:400;color:var(--mut);margin-left:6px}
.nav{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:10px;cursor:pointer}
.nav:hover{background:var(--sf2)}
.nav.cur{background:var(--acs)}
.nav .l{font-family:Newsreader,Georgia,serif;font-weight:700;font-size:17px;width:20px;flex:none;line-height:1.2}
.nav .t{display:block;font-size:14px;font-weight:500}
.nav .s{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:6px}
.dot.prog{border-color:var(--wn);background:var(--wns)}
.dot.done{border-color:var(--ok);background:var(--ok)}
.kick{color:var(--mut);font-size:13px;margin-bottom:6px}
h1{font-family:Newsreader,Georgia,serif;font-size:clamp(22px,3.4vw,30px);line-height:1.25;margin:0 0 10px;font-weight:700}
h1 .let{color:var(--ac);margin-right:4px}
.badge{display:inline-block;background:var(--acs);color:var(--ac);border-radius:20px;padding:2px 12px;font-size:12.5px;font-weight:600;margin-bottom:20px}
.body{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
@media(max-width:760px){.two{grid-template-columns:1fr}.body{padding:14px}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:4px;border:1px solid transparent}
.row.ok,.mxrow.ok{background:var(--oks)}
.row.bad,.mxrow.bad{background:var(--bads)}
.num{min-width:26px}
.term{font-weight:600}
select,input[type=text],textarea{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
select.ok,input.ok,textarea.ok{border-color:var(--ok);background:var(--oks)}
select.bad,input.bad,textarea.bad{border-color:var(--bad);background:var(--bads)}
.ans{color:var(--ok);font-size:13px;font-weight:600}
.defs .def{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.defs .def b{color:var(--ac)}
.lbl{min-width:110px}
.fix{color:var(--mut);font-style:italic}
.slot{display:inline-flex;flex-wrap:wrap;gap:6px;min-width:80px;min-height:30px;border-bottom:2px dotted var(--line);padding:2px 4px}
.row.syn{cursor:pointer}
.row.syn.act{border-color:var(--ac);background:var(--acs)}
.tag{border:0;background:var(--ac);color:#fff;border-radius:14px;padding:2px 10px;font-size:13px;cursor:pointer}
.wbox{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--sf2)}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:20px;padding:4px 14px;cursor:pointer}
.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.zero{opacity:.45}.chip.over{border-color:var(--bad);color:var(--bad)}
.hintline{color:var(--mut);font-size:13px;margin-top:8px}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;text-align:left;padding:8px;border-bottom:2px solid var(--ink);color:var(--mut);font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td input{width:100%;min-width:110px}
.given{font-weight:500}.given.pl{font-style:italic}
.hint{color:var(--ok);font-size:12.5px;font-weight:600;margin-top:2px}
.sent{margin:0 0 14px;padding:10px 12px;border-radius:10px;line-height:2.1}
.sent.ok{background:var(--oks)}.sent.bad{background:var(--bads)}
.fixed{font-weight:700;color:var(--ac);border-bottom:2px solid var(--ac);padding:0 6px}
.mxrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:4px}
.mxrow .w{font-weight:600;min-width:90px}
.mxrow input[type=text]{flex:1;min-width:170px}
.prev-e{color:var(--mut);font-size:13px;min-width:120px}
.qitem{padding:14px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.q{display:flex;gap:6px;margin-bottom:8px}
.qt{font-size:15.5px}
.qt.pl{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:17px}
textarea{width:100%;resize:vertical;line-height:1.5}
.live{font-size:12.5px;color:var(--mut);margin-top:4px;min-height:18px}
.prev{margin-top:4px;padding:8px 10px;background:var(--sf2);border-radius:8px;font-size:14px}
mark{background:var(--mk);color:inherit;border-radius:3px;padding:0 2px}
.fb{margin-top:8px;font-size:14px;font-weight:500}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.warn{color:var(--wn)}
.ref{margin-top:10px;padding:12px 14px;border:1px dashed var(--ac);border-radius:10px;background:var(--acs)}
.refh{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:4px}
.model{font-family:Newsreader,Georgia,serif;font-size:16.5px;margin-bottom:8px}
.pts{margin:4px 0 10px;padding-left:20px;font-size:14px}
.selfq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:10px;padding:8px 18px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--sf);color:var(--ac)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.okb{border-color:var(--ok);background:var(--sf);color:var(--ok)}.btn.okb.on{background:var(--ok);color:#fff}
.btn.nob{border-color:var(--bad);background:var(--sf);color:var(--bad)}.btn.nob.on{background:var(--bad);color:#fff}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.exbox{padding:12px 14px;margin-bottom:10px;border-radius:10px;background:var(--sf2)}
ins{color:var(--ok);text-decoration:none;font-weight:700;border-bottom:2px solid var(--ok)}
del{color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.score{margin-left:auto;font-weight:600;color:var(--mut)}
.pn{display:flex;justify-content:space-between;margin-top:26px}
</style>
</head>

<script>
/* ================= LOGIC ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function toks(s){const out=[],re=/[\p{L}\p{N}]+(?:['’][\p{L}]+)?/gu;let m;while((m=re.exec(s)))out.push({raw:m[0],i:m.index,n:strip(m[0]).replace(/['’]/g,'')});return out}
function tokMatch(t,w){if(w.endsWith('$'))return t===w.slice(0,-1);if(t.startsWith(w))return true;if(w.length>=6){const p=t.slice(0,w.length);if(lev(p,w)<=1&&t.length<=w.length+4)return true}return false}
function findAlt(T,alt){const ws=alt.split(' ');for(let i=0;i+ws.length<=T.length;i++){let ok=true;for(let j=0;j<ws.length;j++)if(!tokMatch(T[i+j].n,ws[j])){ok=false;break}if(ok)return ws.map((_,j)=>i+j)}return null}
function evalKw(it,text){
 const T=toks(text),hits=new Set();
 const found=it.must.map(g=>{let f=false;for(const a of g){const r=findAlt(T,a);if(r){r.forEach(i=>hits.add(i));f=true}}return f});
 const bad=(it.not||[]).filter(x=>findAlt(T,x.a)).map(x=>x.m);
 const startOk=!it.start||it.start.some(a=>{const ws=a.split(' ');return ws.every((w,j)=>T[j]&&tokMatch(T[j].n,w))});
 const n=found.filter(Boolean).length,need=it.must.length-(it.skip||0);
 return {T,hits,found,bad,startOk,n,need,pass:n>=need&&!bad.length&&startOk&&T.length>=(it.min||1)};
}
function hl(text,ev){let out='',last=0;ev.T.forEach((t,k)=>{out+=esc(text.slice(last,t.i));out+=ev.hits.has(k)?'<mark>'+esc(t.raw)+'</mark>':esc(t.raw);last=t.i+t.raw.length});return out+esc(text.slice(last))}
const lt=s=>strip(s).replace(/&/g,' and ').replace(/^\s*(to|a|an|the)\s+/,'').replace(/[^a-z0-9]/g,'');
const tol=n=>n>=25?3:n>=12?2:n>=5?1:0;
function shortOk(inp,acc){const A=acc.map(lt);return [inp,...inp.split(/\s*[\/;]\s*/)].some(c=>{const x=lt(c);return x&&A.some(a=>x===a||lev(x,a)<=tol(a.length))})}
const lab=g=>g[0].replace(/\$$/,'');

 defs:{a:"additional value of a company which is not a physical asset and represents the value of company’s brand name, good customer relations, good employee relations, etc.",b:"activities of a business which aim is to discover new technology in order to develop new products or improve the existing product development processes",c:"data that has been collected but has not been processed",d:"a way of getting opinions from a panel of independent experts",e:"property owned by a business that can be touched such as land, machinery, inventory etc.",f:"a specialized information system used to support senior-level decision making",g:"a 2x2 matrix used to analyse the importance of existing information systems of a company as well as strategic impact of future information systems on building company’s competitive advantage",h:"a system which enables planning, monitoring and making decisions on everyday issues on the basis of regular reports for every level of management in a company"}},

 box:['influence','objective','nowadays','purpose','presently','essential','mainly','aim','chiefly','crucial','important','meaningful'],
 words:[{w:'currently',pre:'now,',key:['nowadays','presently'],alt:[]},{w:'significant',key:['important','meaningful'],alt:['crucial','essential']},{w:'goal',key:['objective','purpose','aim'],alt:[]},{w:'fundamental',key:['essential','crucial'],alt:['important']},{w:'impact',key:['influence'],alt:[]},{w:'primarily',key:['mainly','chiefly'],alt:[]}]},

{id:'p1E',L:'E',kind:'mx',type:'Kolokacje i tłumaczenie',title:'Match the word from the left with the one from the right to build full expression from the text and translate it into Polish.',count:9,

 rows:[['DSS',['decision support system','decision-support system']],['MNC',['multinational corporation','multinational company','multinational enterprise','multi-national corporation']],['ROI',['return on investment']],['ERP',['enterprise resource planning']],['SME',['small and medium-sized enterprises','small and medium-sized enterprise','small and medium enterprises','small and medium enterprise','small and medium-sized businesses','small and medium-sized companies','small to medium enterprise']]]},
{id:'p1G',L:'G',kind:'open',type:'Tłumaczenie PL → EN',title:'Translate the following sentences into English.',count:5,items:[
 {key:'g1',n:1,pl:1,q:'Obecnie IT staje się coraz bardziej istotnym elementem w rozwoju każdej firmy. Z tego względu inwestycje w IT są w dzisiejszych czasach integralną częścią biznesplanu każdego przedsiębiorstwa, które chce zyskać przewagę konkurencyjną.',

 {key:'g2',n:2,pl:1,q:'Zgodnie z defensywnym podejściem do inwestycji w IT w macierzy McFarlana przedsiębiorstwo może m.in. inwestować w aplikacje, które nie są krytyczne dla pomyślnego działania przedsiębiorstwa.',

/* open boxes */
function openBox(st,key,it){
 const ta=h('textarea',{rows:it.rows||3,placeholder:it.ph||'Wpisz swoją odpowiedź…',spellcheck:'false',autocomplete:'off'});

  if(it.init&&t.trim()===it.init.trim()){fb.className='fb bad';fb.textContent='Nie wprowadzono żadnych zmian w zdaniu.';mark(ta,false);delete st.self[key];setRes(st,key,'bad');return}
  const msg=[];if(!ev.startOk)msg.push(it.startMsg||'Zła konstrukcja początku zdania.');msg.push(...ev.bad);
  if(ev.n<ev.need){const miss=ev.found.map((f,i)=>f?null:lab(it.must[i])).filter(Boolean);msg.push('Brakujące elementy (pojęcia): '+miss.join(', ')+'.')}

 const el=h('div',null,ta,live,prev,fb,h('div',{class:'btns'},h('button',{class:'btn sm',onclick:check},'Sprawdź'),h('button',{class:'btn sm ghost',onclick:reveal},'Wzorzec i samoocena')),ref);

 if(st.self[key]){reveal();const v=st.self[key];bOk.classList.toggle('on',v==='ok');bNo.classList.toggle('on',v==='redo');fb.className='fb '+(v==='ok'?'ok':'warn');fb.textContent=v==='ok'?'✓ Samoocena: poprawna.':'Do poprawy: porównaj z wzorcem i spróbuj jeszcze raz.'}
