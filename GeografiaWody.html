<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wody okalajace europe</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        #map {
            height:99vmin;
        }
        html,body,#map{
            height:100%;
            margin:0;
            padding:0}
        body{
            font-family:Inter,Arial,Helvetica,sans-serif;
            background:#0b1220;
            color:#e6eef8;
            overflow:hidden
        }
        
        #panel{
        position:fixed;
        right:12px;
        top:12px;
        z-index:1200;
        background:rgba(2,6,23,0.75);
        backdrop-filter:blur(2px);
        padding:12px;
        border-radius:10px;
        box-shadow:0 6px 20px rgba(2,6,23,0.7);
        min-width:280px
        }
        #panel select,#panel button{
            width:100%;
            margin:6px 0;
            padding:8px;
            border-radius:8px;
            border:0;
            font-size:14px
        }
        #panel button{
        background:#0ea5a4;
        color:#002;
        cursor:pointer;
        font-weight:bold
        }
        #status{
        margin-top:8px;
        font-size:14px;
        color:#d1f3ff
        }
        .small{
            font-size:12px;
            color:#9fb7c9;
            margin-top:6px
        }
    </style>
</head>
<body>

    <div id="panel">
    <label>Tryb:
      <select id="modeSelect"><option value="nauka">Nauka</option><option value="test">Test</option></select>
    </label>

    <button id="startBtn">Start</button>
    <!--
    <button id="nextBtn" style="display:none; margin-top:6px; background:#7dd3fc; color:#002">Następne pytanie</button>
    -->
    <div id="status"><b>Wybierz tryb i naciśnij Start</b></div>
    <small id="info" style="font-size: 10px; display: none; width:auto;">Pytania zmieniają się 3s po odpowiedzi</small>
  </div>

    <div id="map"></div>




    <!--Script-->  
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

    }


    
    //Config mapy
    const map = L.map('map').setView([55.973798,20.830078], 4);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 20,
        minZoom: 2
    }).addTo(map);

    map.setMaxBounds([[27.994401,-29.970703], [77.235074,65.390625]])


    //rozmieszczenie znaczników
    const marker = null;
    PLACES.forEach(function(nazwa) {
        const coords = COORDS[nazwa];
        const marker = L.marker(coords).addTo(map);
        marker.bindPopup(nazwa);
        marker.on('click', ()=> MarkerClicked(nazwa, marker));
    });

    let mode = "nauka"

    //tryby 

    function MarkerClicked (nazwa, marker) {
        if (mode == 'nauka') {
            //console.log(mode);
        }
        else if (mode == 'test') {
            //sprawdzanie
            if (nazwa == pytanie) {
                document.getElementById("status").textContent = 'DOBRZE';
            }
            else {
                document.getElementById("status").textContent = 'Źle';
            }
            setTimeout(losujpyt, 1000);
        }
    }

    //quiz

    let pytanie = null
// losowanie pytań
    function losujpyt(nazwa) {
        pytanie = PLACES[Math.floor(Math.random() * PLACES.length)];
        document.getElementById("status").textContent = pytanie;
        //console.log(pytanie);
    }



   //przyciski
   document.getElementById("startBtn").addEventListener("click", () => {
    mode = document.getElementById("modeSelect").value;
    //console.log(mode);
    if (mode == 'test') {
            document.getElementById("info").style.display = 'block';
            losujpyt();
        }
    else if (mode == 'nauka') {
        document.getElementById("info").style.display = 'none';
        document.getElementById("status").textContent = '';
    }
   });

    </script>
    
</body>
</html>
